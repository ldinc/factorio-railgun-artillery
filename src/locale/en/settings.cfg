[mod-setting-description]
ldinc_railgun_artillery_ticks_per_gui_update=Warning: highly recomends every 5 tick == 60/5 (~= 0.08s)
ldinc_railgun_artillery_damage_scale=Inherits from relative artillery shell
ldinc_railgun_artillery_recipe_scale=Set count of artillery shell

ldinc_railgun_artillery_no_power_alert=Draws the "not connected to an electric network" icon.

ldinc_railgun_artillery_animation_radius=The charging glow is only drawn for railguns within this many tiles of any player. 0 draws it everywhere.

ldinc_railgun_artillery_charge_animation=Draws the accumulator style glow on the railgun while its buffer is charging.
