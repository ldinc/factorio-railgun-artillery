[tips-and-tricks-item-description]
ldinc-railgun-artillery=The [entity=ldinc-railgun-artillery] fires [img=item/ldinc-railgun-ammo-loaded] railgun artillery shells at targets up to 400 tiles away by default, twice that when you aim it with the [img=item/artillery-targeting-remote] artillery targeting remote.\n\nUnlike the regular [img=entity/artillery-turret] artillery turret, every shot is also paid for in electricity. Shells alone are not enough: the turret has to be connected to your electric network.
ldinc-railgun-artillery-charging=Every shot takes 10 MJ from the turret's own buffer, which holds ten shots and refills from the electric network (default settings).\n\nWhile the buffer fills, the turret glows. As soon as one shot is stored it fires like any other artillery. On a weak network it fires only as fast as the buffer refills, and a turret with no connection at all shows [img=utility/electricity_icon_unplugged] and does not fire.
ldinc-railgun-artillery-shells=The turret only accepts [img=item/ldinc-railgun-ammo-loaded] railgun artillery shells. Each one is made from a [img=item/ldinc-railgun-ammo-body] shell body and three [img=item/artillery-shell] artillery shells by default, so an existing artillery shell supply can be converted rather than replaced.\n\nRegular artillery shells are not accepted.
ldinc-railgun-artillery-power-planning=A recharging railgun turret draws up to 30 MW by default, so ten turrets refilling after a volley want 300 MW. Every other machine on the same network slows down while they do.\n\nGive the turrets a network of their own, with its own generation. [img=entity/accumulator] Accumulators help less than you might expect: one delivers 300 kW, so covering a single turret's recharge takes about a hundred of them.

